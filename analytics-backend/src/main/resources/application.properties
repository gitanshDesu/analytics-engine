spring.application.name=analytics-backend
server.servlet.context-path=/analytics-backend

spring.data.mongodb.uri=mongodb://127.0.0.1:27017/analytics

server.port=8084

spring.config.import=optional:file:.env[.properties]

jwt.secret=${JWT_SECRET}
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-ms=604800000