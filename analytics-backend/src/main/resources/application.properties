spring.application.name=analytics-backend
server.servlet.context-path=/analytics-backend

spring.mongodb.uri=mongodb://127.0.0.1:27020,127.0.0.1:27021/analytics?replicaSet=rs_analytics

server.port=8085

spring.config.import=optional:file:.env[.properties]

jwt.secret=${JWT_SECRET}
jwt.access-token-expiry-ms=86400000
jwt.refresh-token-expiry-ms=604800000

#Kafka configuration:
# Connection
spring.kafka.bootstrap-servers=localhost:9092

# Producer — sending objects as JSON
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Producer batching (network-level batching — cheap win, do this)
spring.kafka.producer.properties.linger.ms=20
spring.kafka.producer.properties.batch.size=32768
spring.kafka.producer.properties.compression.type=snappy

# Consumer — reading JSON back into EventRequest objects
spring.kafka.consumer.group-id=event-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.listener.concurrency=3